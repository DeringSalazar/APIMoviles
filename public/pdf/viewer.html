<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Visor de Catálogo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary-red: #D32F2F;
      --black: #1A1A1A;
      --yellow: #FBC02D;
      --bg-gradient: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
      --white: #FFFFFF;
      --toolbar-height: 80px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #viewer-wrapper {
      width: 100%;
      height: calc(100vh - var(--toolbar-height) - env(safe-area-inset-bottom));
      overflow-y: auto;
      overflow-x: auto;
      display: block;
      -webkit-overflow-scrolling: touch;
      padding: 20px 10px;
    }

    #canvas-container {
      display: block;
      margin: 0 auto;
      text-align: center;
      min-width: min-content;
    }

    canvas {
      display: inline-block;
      max-width: 100%;
      height: auto !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border-radius: 4px;
      background: white;
      margin-bottom: 20px;
    }

    #toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--toolbar-height) + env(safe-area-inset-bottom));
      background: var(--white);
      border-top: 4px solid var(--primary-red);
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 10px env(safe-area-inset-bottom) 10px;
      z-index: 100;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
      pointer-events: auto;
      visibility: hidden;
    }

    .btn-group { display: flex; gap: 8px; align-items: center; }

    button {
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
      pointer-events: auto;
    }

    button:disabled { background: #ccc; }

    .btn-zoom {
      background: var(--black);
      font-size: 20px;
    }

    @media (max-width: 768px) {
      .btn-group-zoom {
        display: none !important;
      }
      canvas { max-width: none; width: 100%; }
    }

    #page-info {
      font-size: 13px;
      font-weight: 800;
      color: var(--black);
      background: var(--yellow);
      padding: 10px 15px;
      border-radius: 8px;
      text-align: center;
      min-width: 90px;
    }

    #loading, #error {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      background: white;
    }

    #error { display: none; color: red; padding: 20px; text-align: center; }

    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="loader"></div>
    <p>Abriendo catálogo...</p>
  </div>

  <div id="error">
    <p><strong>Error:</strong> No se pudo cargar el catálogo.</p>
    <button onclick="location.reload()" style="margin-top:20px">Intentar de nuevo</button>
  </div>

  <div id="viewer-wrapper">
    <div id="canvas-container"></div>
  </div>

  <div id="toolbar">
    <div class="btn-group btn-group-zoom">
      <button class="btn-zoom" onclick="changeZoom(-0.25)">−</button>
      <button class="btn-zoom" onclick="changeZoom(0.25)">+</button>
    </div>

    <button id="prev" onclick="changePage(-1)">◀ Ant</button>
    <div id="page-info">Pág 0 / 0</div>
    <button id="next" onclick="changePage(1)">Sig ▶</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const urlParams = new URLSearchParams(window.location.search);
    

    const pdfFromUrl = urlParams.get('pdf');
    const PDF_URL = '__PDF_URL__';    
    const targetPage = parseInt(urlParams.get('page')) || 1;

    let pdfDoc = null;
    let currPage = 1;
    

    let currScale = (window.innerWidth < 768) ? 0.55 : 0.85; 
    let isRendering = false;

    const container = document.getElementById('canvas-container');
    const wrapper = document.getElementById('viewer-wrapper');
    const pageInfo = document.getElementById('page-info');

    async function loadPDF() {
      try {
      
        pdfDoc = await pdfjsLib.getDocument({
          url: PDF_URL,
          withCredentials: false, 
          disableAutoFetch: true,
          rangeChunkSize: 65536,
        }).promise;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('toolbar').style.visibility = 'visible'; 
        currPage = Math.min(Math.max(1, targetPage), pdfDoc.numPages);
        await renderPage(currPage);

        preloadNearbyPages(currPage);
      } catch (e) {
        showError("No se pudo conectar con el servidor del PDF.");
        console.error("Detalle del error:", e);
      }
    }

    async function renderPage(pageNum) {
      if (isRendering) return;
      isRendering = true;

      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: currScale });

        container.innerHTML = '';
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;
        canvas.width = viewport.width * dpr;
        canvas.height = viewport.height * dpr;
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';
        ctx.scale(dpr, dpr);

        container.appendChild(canvas);

        await page.render({ canvasContext: ctx, viewport }).promise;

        currPage = pageNum;
        pageInfo.textContent = `Pág ${currPage} / ${pdfDoc.numPages}`;
        document.getElementById('prev').disabled = currPage <= 1;
        document.getElementById('next').disabled = currPage >= pdfDoc.numPages;
      } catch (e) {
        showError('Error al renderizar: ' + e.message);
      }

      isRendering = false;
    }

    async function preloadNearbyPages(current) {
      const pagesToPreload = [];
      if (current > 1) pagesToPreload.push(current - 1);
      if (current < pdfDoc.numPages) pagesToPreload.push(current + 1);

      for (const pageNum of pagesToPreload) {
        try {
          await pdfDoc.getPage(pageNum);
          console.log('[Preload] Página ' + pageNum + ' precargada');
        } catch (e) {
        }
      }
    }

    function changePage(num) {
      const nextPage = currPage + num;
      if (nextPage < 1 || nextPage > pdfDoc.numPages || isRendering) return;
      renderPage(nextPage);
      wrapper.scrollTop = 0;
    }

    function changeZoom(delta) {
      const newScale = currScale + delta;
      if (newScale >= 0.5 && newScale <= 3) {
        currScale = newScale;
        renderPage(currPage);
      }
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'flex';
      document.getElementById('error').querySelector('p').innerHTML =
        '<strong>Error:</strong> ' + msg;
    }

    loadPDF();
  </script>
</body>
</html>
